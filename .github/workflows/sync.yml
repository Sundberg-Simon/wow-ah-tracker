name: Sync EU auction prices

on:
  schedule:
    # GitHub Actions' cron scheduler drops ticks unpredictably on this repo
    # (confirmed via createdAt gaps in run history - not runner queue delay).
    # Running every 15 min gives 4 chances/hour so a dropped tick doesn't
    # matter; runFullSync() self-throttles to stay near-hourly regardless.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Never two sync runs at once. Without this, a delayed tick and the next
# on-time tick could run in parallel, both pass the self-throttle (it isn't
# atomic against a concurrent process) and write two near-identical snapshots.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung run shouldn't eat hours of the Actions quota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sync # applies schema + syncs in one process, see scripts/runSyncOnce.ts
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run report # reads from the DB only, writes reports/index.html
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
