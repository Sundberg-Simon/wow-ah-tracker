name: Sync EU auction prices

on:
  schedule:
    # GitHub Actions' cron scheduler drops ticks unpredictably on this repo
    # (confirmed via createdAt gaps in run history - not runner queue delay).
    # Running every 15 min gives 4 chances/hour so a dropped tick doesn't
    # matter; runFullSync() self-throttles to stay near-hourly regardless.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run sync
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
